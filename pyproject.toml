[project]
name = "retail-bi"
version = "1.0.0"
description = "Retail sales and customer analytics on the UCI Online Retail II dataset"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "full_data: needs the downloaded dataset (skipped if missing)",
]
